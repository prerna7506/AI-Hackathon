<aside class="sidebar">
  <!-- Brand Logo -->
  <div class="brand" (click)="openProfile()" style="cursor: pointer;" title="FinMate AI Platform">
    <div class="brand-logo">
      <div class="logo-shield">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="9" fill="currentColor" class="logo-bg"/>
          <path d="M10 21L16 9L22 21H18L16 16.5L14 21H10Z" fill="white"/>
          <circle cx="21" cy="11" r="3" fill="#34D399"/>
        </svg>
      </div>
    </div>
    <div class="brand-info">
      <div class="brand-name-wrap">
        <h2 class="brand-name">FinMate AI</h2>
        <span class="enterprise-tag">PRO</span>
      </div>
      <span class="brand-tagline">Financial Intelligence Hub</span>
    </div>
  </div>

  <!-- Main Navigation -->
  <nav class="nav-menu">
    <div class="nav-section-label">MAIN NAVIGATION</div>
    @for (item of navItems; track item.id) {
      <a 
        class="nav-item" 
        [routerLink]="item.route"
        routerLinkActive="active"
      >
        <!-- Icon rendering based on type -->
        <span class="nav-icon">
          @if (item.icon === 'grid') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          } @else if (item.icon === 'bot') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
          } @else if (item.icon === 'flag') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          } @else if (item.icon === 'bulb') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>
          } @else if (item.icon === 'trending') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          }
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Bottom Action Section -->
  <div class="sidebar-footer">
    <!-- Quick Chat CTA -->
    <button class="btn-quick-chat" routerLink="/ai-advisor">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>Quick Chat</span>
    </button>

    <div class="footer-links">
      <button class="footer-link" (click)="openProfile()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Support / Profile</span>
      </button>
      
      <button class="footer-link" (click)="openAuth()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>{{ authService.isLoggedIn() ? 'Sign Out' : 'Sign In' }}</span>
      </button>
    </div>
  </div>
</aside>
