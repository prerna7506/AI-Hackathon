@if (goalsService.isModalOpen()) {
  <div class="modal-backdrop" (click)="close()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <!-- Modal Header -->
      <div class="modal-header">
        <div class="header-left">
          <div class="header-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
          <h3>Create New Financial Goal</h3>
        </div>
        <button class="btn-close" (click)="close()">✕</button>
      </div>

      <!-- Form Body -->
      <form class="modal-body" (ngSubmit)="onSubmit()">
        <!-- Goal Title -->
        <div class="form-group">
          <label>Goal Name</label>
          <input 
            type="text" 
            placeholder="e.g. Buy a Car, European Trip, Kids College" 
            [(ngModel)]="title" 
            name="title" 
            required 
          />
        </div>

        <!-- Category / Icon Selection Grid -->
        <div class="form-group">
          <label>Goal Category</label>
          <div class="icon-options-grid">
            @for (opt of iconOptions; track opt.id) {
              <button 
                type="button" 
                class="icon-opt-btn" 
                [class.selected]="selectedIcon === opt.id"
                (click)="selectedIcon = $any(opt.id)"
              >
                @if (opt.id === 'car') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C1.4 11.2 1 12.1 1 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
                } @else if (opt.id === 'house') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                } @else if (opt.id === 'flight') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.2c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z"/></svg>
                } @else if (opt.id === 'graduation') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                } @else if (opt.id === 'retirement') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>
                } @else if (opt.id === 'shield') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                }
                <span>{{ opt.label }}</span>
              </button>
            }
          </div>
        </div>

        <!-- Amounts Row -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label>Target Amount (₹)</label>
            <input 
              type="number" 
              placeholder="e.g. 1000000" 
              [(ngModel)]="targetAmount" 
              name="targetAmount" 
              required 
            />
          </div>

          <div class="form-group flex-1">
            <label>Starting Deposit (₹)</label>
            <input 
              type="number" 
              placeholder="e.g. 250000" 
              [(ngModel)]="startingAmount" 
              name="startingAmount" 
            />
          </div>
        </div>

        <!-- Timeline Slider -->
        <div class="form-group">
          <div class="label-row">
            <label>Timeline (Years)</label>
            <span class="range-val">{{ timelineYears }} Years</span>
          </div>
          <input 
            type="range" 
            min="1" 
            max="25" 
            [(ngModel)]="timelineYears" 
            name="timelineYears" 
            class="custom-range" 
          />
        </div>

        <!-- Form Actions -->
        <div class="modal-footer">
          <button type="button" class="btn-cancel" (click)="close()">Cancel</button>
          <button type="submit" class="btn-submit">Create Goal</button>
        </div>
      </form>
    </div>
  </div>
}
