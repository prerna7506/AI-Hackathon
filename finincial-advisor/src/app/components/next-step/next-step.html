<div class="next-step-card">
  <div class="card-header">
    <div class="header-left">
      <div class="header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00A389" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
          <polyline points="17 6 23 6 23 12"/>
        </svg>
      </div>
      <h3 class="card-title">Next Step</h3>
    </div>
    <div class="header-right">
      @if (isApplied()) {
        <span class="applied-pill">✓ Applied</span>
      }
      <button 
        class="btn-toggle-boost-edit" 
        [class.active]="isEditingBoost()" 
        (click)="toggleEditBoost()"
        title="Set custom monthly savings amount"
      >
        @if (isEditingBoost()) {
          <span>Close</span>
        } @else {
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <span>Set ₹</span>
        }
      </button>
    </div>
  </div>

  <p class="description">{{ recommendationText() }}</p>

  @if (!isEditingBoost()) {
    <div class="highlight-box" [class.applied-box]="isApplied()">
      <p class="highlight-title">{{ highlightText() }}</p>
      @if (targetDetailsText()) {
        <p class="highlight-sub">{{ targetDetailsText() }}</p>
      }
    </div>
  } @else {
    <div class="boost-edit-form">
      <div class="boost-presets-row">
        <span class="presets-label">Quick:</span>
        <button type="button" class="preset-chip" (click)="setBoostPreset(3000)">₹3,000</button>
        <button type="button" class="preset-chip" (click)="setBoostPreset(5000)">₹5,000</button>
        <button type="button" class="preset-chip" (click)="setBoostPreset(6000)">₹6,000</button>
        <button type="button" class="preset-chip" (click)="setBoostPreset(10000)">₹10,000</button>
      </div>

      <div class="boost-input-row">
        <span class="currency-prefix">₹</span>
        <input 
          type="number" 
          min="500" 
          step="500" 
          [ngModel]="customBoostAmount()" 
          (ngModelChange)="customBoostAmount.set($event)"
          class="boost-num-input"
          placeholder="e.g. 6000"
        />
        <span class="per-month-text">/ mo</span>
      </div>

      <div class="boost-actions-row">
        <button type="button" class="btn-cancel-boost" (click)="isEditingBoost.set(false)">Cancel</button>
        <button type="button" class="btn-save-boost" (click)="saveCustomBoost()">Save for AI</button>
      </div>
    </div>
  }

  <button 
    class="btn-apply" 
    [class.btn-applied]="isApplied()" 
    (click)="openRecommendationModal()"
  >
    @if (isApplied()) {
      <span>View / Adjust Recommendation</span>
    } @else {
      <span>Apply Recommendation</span>
    }
  </button>
</div>
