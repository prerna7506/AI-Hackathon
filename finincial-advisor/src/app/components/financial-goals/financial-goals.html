<main class="main-content">
  <!-- Top Header -->
  <header class="content-header">
    <div class="header-titles">
      <h1 class="page-title">Financial Goals</h1>
      <p class="page-subtitle">Track and manage your wealth accumulation milestones.</p>
    </div>

    <button class="btn-create-goal" (click)="goalsService.openModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Create New Goal</span>
    </button>
  </header>

  <!-- Dashboard Main Grid -->
  <div class="dashboard-grid">
    <!-- Left / Primary Column -->
    <div class="left-column">
      <!-- Featured Primary Goal Card -->
      <app-primary-goal></app-primary-goal>

      <!-- Bottom Sub Cards Grid -->
      <div class="sub-cards-row">
        <app-allocation-strategy></app-allocation-strategy>
        <app-next-step></app-next-step>
      </div>
    </div>

    <!-- Right Column (Portfolio) -->
    <div class="right-column">
      <app-portfolio></app-portfolio>
    </div>
  </div>
</main>
