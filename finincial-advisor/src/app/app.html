<div class="app-layout">
  <app-sidebar></app-sidebar>
  <div class="app-main">
    <router-outlet></router-outlet>
  </div>
  <app-auth-modal></app-auth-modal>
  <app-create-goal-modal></app-create-goal-modal>
  <app-apply-recommendation-modal></app-apply-recommendation-modal>
  <app-review-budget-modal></app-review-budget-modal>

  @if (goalsService.toastMessage()) {
    <div class="global-toast-notification">
      <div class="toast-content">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00A389" stroke-width="2.5">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span>{{ goalsService.toastMessage() }}</span>
      </div>
    </div>
  }
</div>
